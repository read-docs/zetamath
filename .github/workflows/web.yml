name: web

on:
  push:
    branches: [main]
    paths: ['web/**', 'shared/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'shared/**', '.github/workflows/web.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Includes the shared fixture check: a change to the web engine must re-export shared/fixtures.
      - run: npm test
      - run: npm run build
